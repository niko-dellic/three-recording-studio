<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      (() => {
        let preference = "auto";
        try {
          preference =
            localStorage.getItem("vitepress-theme-appearance") || "auto";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("light", !dark);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #171717;
        color: #fafafa;
        color-scheme: dark;
      }
      html.light,
      html.light body {
        background: #fff;
        color: #171717;
        color-scheme: light;
      }
    </style>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:," />
    <title>Three Recording Studio</title>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/"
        ><span class="brand-mark">◉</span> Three Recording Studio
        <small>0.1</small></a
      >
      <nav>
        <a href="/">Home</a>
        <a href="/guide">Documentation ↗</a
        ><button id="theme">Light theme</button
        ><button id="studio">Edit keyframes</button
        ><select id="backend" aria-label="Rendering backend">
          <option value="webgl">WebGL</option>
          <option value="webgpu">WebGPU</option>
        </select>
        <button
          id="fullscreen"
          aria-label="Enter fullscreen"
          title="Enter fullscreen"
          aria-pressed="false"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          </svg>
        </button>
      </nav>
    </header>
    <main id="workspace"></main>
    <footer>
      <span id="app-status">Preparing scene…</span
      ><span>Bunny / animated clipping plane</span>
    </footer>
    <div id="fatal" role="alert" hidden></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
